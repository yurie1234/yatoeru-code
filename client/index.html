<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale は付けない。ピンチズームを禁止するとWCAG 1.4.4違反になり、
         機関の連絡先や登録番号を拡大して確かめたい利用者が読めなくなる -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1c3357" />
    <link rel="alternate" type="application/rss+xml" title="ヤトエル｜登録支援機関登録簿の更新情報・解説記事" href="https://yatoeru.jp/rss.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
    <!-- 旧ホスティング（Manus）のumami計測タグは削除した。環境変数のプレースホルダが
         本番ビルドでは置換されず、ブラウザが未置換のパスを取得しに行き、SSRの受け皿が
         200でHTML（約400KB）を返していた。全ページ表示で毎回この無駄な往復が発生していた。
         計測はGA4だけで足りている -->
    <!-- Google Analytics 4（運営者除外: localStorage.yt_exclude === '1' で計測無効化） -->
    <script>
      try {
        if (localStorage.getItem('yt_exclude') === '1') {
          window['ga-disable-G-64NQW74LWS'] = true;
        }
      } catch (e) {}
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-64NQW74LWS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-64NQW74LWS', { send_page_view: false });
    </script>
  </body>

</html>
